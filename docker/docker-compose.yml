version: '3.8'

services:
  # ========================================
  # Infrastructure Services
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: sustainpro-postgres
    environment:
      POSTGRES_USER: sustainpro
      POSTGRES_PASSWORD: sustainpro_dev
      POSTGRES_DB: sustainpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sustainpro"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sustainpro-rabbitmq
    ports:
      - "5672:5672"   # AMQP Protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: sustainpro
      RABBITMQ_DEFAULT_PASS: sustainpro_dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
