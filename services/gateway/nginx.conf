worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-font-ttf
               font/opentype image/svg+xml;

    # Security headers (applied globally)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=telemetry_limit:10m rate=100r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream services
    upstream auth_service {
        server auth-service:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream core_service {
        server core-service:5001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream iot_service {
        server iot-service:5002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Map for CORS origin validation
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:\d+)?$" $http_origin;
        "~^https?://.*\.sustainpro\.io$" $http_origin;
        "~^https?://sustainpro\.io$" $http_origin;
    }

    # Main server block
    server {
        listen 8080;
        server_name _;

        # Connection limits
        limit_conn conn_limit 100;

        # Client body size (for file uploads)
        client_max_body_size 50M;

        # CORS headers - applied conditionally
        set $cors_headers "";
        if ($cors_origin != "") {
            set $cors_headers "true";
        }

        # Add CORS headers when origin is valid
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-API-Key, X-Device-Id, X-Request-Id, X-Webhook-Secret' always;
        add_header 'Access-Control-Max-Age' '86400' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ============================================
        # Health Check Endpoints
        # ============================================

        location = /health {
            access_log off;
            return 200 '{"status":"healthy","service":"gateway","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        location = /health/services {
            access_log off;
            default_type application/json;
            content_by_lua_block {
                -- This requires nginx-lua module, fallback to simple response
            }
            return 200 '{"gateway":"healthy","note":"individual service health checks at /health/<service>"}';
            add_header Content-Type application/json;
        }

        # ============================================
        # Auth Service Routes (/api/v1/auth, /api/v1/users, /api/v1/rbac)
        # ============================================

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api/v1/users/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/v1/rbac/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ============================================
        # Core Service Routes 
        # (organizations, events, departments, services, settings, upload, devices, device-models)
        # ============================================

        location /api/v1/organizations/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://core_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/v1/events/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://core_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/v1/departments/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://core_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/v1/services/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://core_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/v1/settings/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://core_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/v1/upload/ {
            limit_req zone=upload_limit burst=5 nodelay;
            client_max_body_size 50M;
            
            proxy_pass http://core_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Longer timeouts for uploads
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Device management (merged from Phase 5 into Core Service)
        location /api/v1/devices/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://core_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/v1/device-models/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://core_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ============================================
        # IoT Service Routes (telemetry, webhooks, socket.io)
        # ============================================

        location /api/v1/telemetry/ {
            limit_req zone=telemetry_limit burst=50 nodelay;
            
            proxy_pass http://iot_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Device-Id $http_x_device_id;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header Connection "";
        }

        location /api/v1/webhook/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://iot_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Webhook-Secret $http_x_webhook_secret;
            proxy_set_header Connection "";
        }

        # Socket.IO - WebSocket upgrade support
        location /socket.io/ {
            proxy_pass http://iot_service;
            proxy_http_version 1.1;
            
            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific timeouts
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            
            # Buffering off for real-time
            proxy_buffering off;
            proxy_cache off;
        }

        # ============================================
        # Fallback / Error Handling
        # ============================================

        location / {
            return 404 '{"error":"Not Found","message":"The requested endpoint does not exist","path":"$request_uri"}';
            add_header Content-Type application/json;
        }

        # Custom error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            return 500 '{"error":"Internal Server Error","message":"The server encountered an error processing your request"}';
            add_header Content-Type application/json;
        }

        error_page 429 /429.html;
        location = /429.html {
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please try again later."}';
            add_header Content-Type application/json;
        }
    }

    # HTTPS server (when SSL is configured)
    # server {
    #     listen 443 ssl http2;
    #     server_name api.sustainpro.io;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #
    #     # Include all location blocks from above
    # }
}
